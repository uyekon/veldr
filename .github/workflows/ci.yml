name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veldr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veldr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            cms-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        env:
          TEST_CMS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veldr_test
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install CMS frontend dependencies
        working-directory: cms-frontend
        run: npm ci

      - name: Test CMS frontend
        working-directory: cms-frontend
        run: npm test

      - name: Build CMS frontend
        working-directory: cms-frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: cms-frontend
        run: npx playwright install --with-deps chromium

      - name: Test CMS desktop and mobile flows
        working-directory: cms-frontend
        run: npm run test:e2e
