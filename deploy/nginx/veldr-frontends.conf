# Veldr production nginx config (HTTPS behind the SNI stream router).
# 443 由 stream 层（veldr-stream.conf）按 SNI 分流后转入本机 8501；
# 证书由 certbot 管理（HTTP-01 走下方 80 端口 server 块）。
# 注意：经 stream 转发后 http 层看到的客户端 IP 是 127.0.0.1。

upstream veldr_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}

# 静态资源压缩（gzip on 已在主配置 nginx.conf 中开启；API 响应由后端 compression 中间件处理）
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8501 ssl;
    server_name notes.lifetip.top;

    ssl_certificate /etc/letsencrypt/live/notes.lifetip.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.lifetip.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/veldr/dist;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://veldr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /uploads/ {
        proxy_pass http://veldr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:8501 ssl;
    server_name cms.lifetip.top;

    ssl_certificate /etc/letsencrypt/live/notes.lifetip.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.lifetip.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/veldr-cms/dist;
    index index.html;

    client_max_body_size 550m;

    location /api/cms/ {
        proxy_pass http://veldr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /uploads/cms/ {
        proxy_pass http://veldr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 带 hash 的打包产物可长缓存；config.js 用 ?v= 控制，不在此列
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP -> HTTPS（certbot 续期的 HTTP-01 挑战也走这里，certbot 会临时注入 ACME location）
server {
    listen 80;
    listen [::]:80;
    server_name notes.lifetip.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.lifetip.top;
    return 301 https://$host$request_uri;
}
