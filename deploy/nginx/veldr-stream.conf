# SNI 分流（安装到 /etc/nginx/stream-conf.d/，由 nginx.conf 末尾的 stream 块 include）。
# nginx stream 接管 443：Web 应用走本机 HTTPS 站点(8501)，
# ws 走独立 WebSocket 上游(9443)，其余 SNI 原样转发给 sing-box(8500)。
# 此文件是共享基础设施模板。Veldr 日常发布不会覆盖服务器 map；
# 只有显式传入 -ReplaceSharedStream 才会替换，并会先校验所有受保护域名。
# 客户端无感知：TLS 字节流原样透传，证书仍由各自后端出示。

map $ssl_preread_server_name $sni_upstream {
    notes.lifetip.top 127.0.0.1:8501;
    cms.lifetip.top   127.0.0.1:8501;
    nav.lifetip.top   127.0.0.1:8501;
    gotify.lifetip.top 127.0.0.1:8501;
    igotify.lifetip.top 127.0.0.1:8501;
    ws.lifetip.top    127.0.0.1:9443;
    default           127.0.0.1:8500;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $sni_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 600s;
}
